[package]
name        = "rustigram"
description = "Comprehensive async Rust framework for the Telegram Bot API"
keywords    = ["telegram", "bot", "async", "framework"]
categories  = ["api-bindings", "asynchronous"]
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
readme.workspace      = true
repository.workspace  = true
rust-version.workspace = true

[dependencies]
rustigram-types  = { workspace = true }
rustigram-api    = { workspace = true }
rustigram-bot    = { workspace = true }
rustigram-miniapp = { workspace = true, optional = true }
tokio            = { workspace = true }
tracing          = { workspace = true }
anyhow           = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
version-sync = { workspace = true }

[features]
# Forwards to rustigram-bot's `tma` feature, enabling `Context::tma_data` and
# the `web_app_data` filters. Off by default: it pulls in rustigram-miniapp.
tma = ["rustigram-bot/tma", "dep:rustigram-miniapp"]
