name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-D warnings"

jobs:
    fmt:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - run: cargo fmt --all --check

    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@v2
            - run: cargo clippy --all-targets --all-features

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo test --all-features --workspace

    semver:
        name: Semver Check
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - uses: obi1kenobi/cargo-semver-checks-action@v2

    audit:
        name: Security Audit
        runs-on: ubuntu-latest
        permissions:
            security-events: write
        steps:
            - uses: actions/checkout@v6
            - uses: rustsec/audit-check@v2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

    # ── Runs only on push to main, after all checks pass ─────────────────────
    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: [ fmt, clippy, test, audit ]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v6

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - name: Build docs
              run: |
                  ROOT=$(pwd)
                  FLAGS="--theme $ROOT/docs-theme/tg-dark.css"
                  FLAGS="$FLAGS --theme $ROOT/docs-theme/tg-light.css"
                  FLAGS="$FLAGS --default-theme tg-dark"
                  FLAGS="$FLAGS --extend-css $ROOT/docs-theme/hide-defaults.css"
                  FLAGS="$FLAGS --html-in-header $ROOT/docs-theme/init.html"
                  RUSTDOCFLAGS="$FLAGS" cargo doc --no-deps --workspace --all-features

            - name: Add docs index redirect
              run: |
                  printf '<meta http-equiv="refresh" content="0;url=rustigram/index.html">\n' \
                    > target/doc/index.html

            - name: Assemble site
              run: |
                  mkdir -p _site/docs
                  cp site/index.html _site/index.html
                  cp -r target/doc/. _site/docs/

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: _site
                  cname: rustigram.io
                  force_orphan: true
