name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-D warnings"

jobs:
    fmt:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - run: cargo fmt --all --check

    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@v2
            - run: cargo clippy --all-targets --all-features

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo test --all-features --workspace

    # ── The suite must actually run, not merely pass ─────────────────────────
    #
    # A conformance test that stops running looks exactly like one that passes:
    # the job is green either way. This asserts every suite executed and that
    # nothing was skipped, so a renamed file or a stray #[ignore] fails here
    # rather than silently shrinking what CI checks.
    suite-integrity:
        name: Suite Integrity
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2

            - name: Every suite ran, and nothing was skipped
              # The workflow sets CARGO_TERM_COLOR: always, which puts an ANSI
              # reset between "Running" and the path — so a literal grep for
              # "Running tests/x.rs" matches locally and never in CI. Turn colour
              # off for this step rather than parsing around it.
              env:
                  CARGO_TERM_COLOR: never
              run: |
                  set -o pipefail
                  cargo test --all-features --workspace --tests 2>&1 | tee out.txt

                  # Doc tests are excluded above: `rust,ignore` examples are
                  # deliberate, and counting them here would make the check
                  # meaningless.
                  ignored=$(grep -oE '[0-9]+ ignored' out.txt | awk '{s+=$1} END {print s+0}')
                  if [ "$ignored" -ne 0 ]; then
                      echo "::error::$ignored test(s) were skipped rather than run"
                      exit 1
                  fi

                  # Derived from the filesystem, not a hand-kept list. A list
                  # goes stale the moment someone adds a test file — three had
                  # already drifted out of one — and a suite missing from the
                  # list is exactly the silent skip this job exists to catch.
                  missing=0
                  for file in crates/*/tests/*.rs; do
                      suite=$(basename "$file" .rs)
                      grep -q "tests/$suite\.rs" out.txt || {
                          echo "::error::$suite did not run"
                          missing=1
                      }
                  done
                  if [ "$missing" -ne 0 ]; then
                      exit 1
                  fi
                  echo "All conformance and transport suites ran, 0 skipped."

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: llvm-tools-preview
            # Version pinned by hand: taiki-e/install-action is not in the
            # project's action-version table, so verify it on the next bump.
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-llvm-cov
            - uses: Swatinem/rust-cache@v2

            - name: Measure line coverage
              run: cargo llvm-cov --all-features --workspace --summary-only | tee cov.txt

            - name: Report per-crate coverage
              run: |
                  {
                      echo "### Line coverage"
                      echo
                      echo '```'
                      cat cov.txt
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

    semver:
        name: Semver Check
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - uses: obi1kenobi/cargo-semver-checks-action@v2

    audit:
        name: Security Audit
        runs-on: ubuntu-latest
        permissions:
            security-events: write
        steps:
            - uses: actions/checkout@v6
            - uses: rustsec/audit-check@v2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

    # ── Runs only on push to main, after all checks pass ─────────────────────
    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: [fmt, clippy, test, suite-integrity, coverage, audit]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v6

            - name: Inject version into site
              run: |
                  VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
                  sed -i "s|<span class=\"badge\">v[^<]*</span>|<span class=\"badge\">v${VERSION}</span>|" site/index.html

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - name: Build docs
              run: |
                  ROOT=$(pwd)
                  FLAGS="--theme $ROOT/docs-theme/tg-dark.css"
                  FLAGS="$FLAGS --theme $ROOT/docs-theme/tg-light.css"
                  FLAGS="$FLAGS --default-theme tg-dark"
                  FLAGS="$FLAGS --extend-css $ROOT/docs-theme/hide-defaults.css"
                  FLAGS="$FLAGS --html-in-header $ROOT/docs-theme/init.html"
                  RUSTDOCFLAGS="$FLAGS" cargo doc --no-deps --workspace --all-features

            - name: Add docs index redirect
              run: |
                  printf '<meta http-equiv="refresh" content="0;url=rustigram/index.html">\n' \
                    > target/doc/index.html

            - name: Assemble site
              run: |
                  mkdir -p _site/docs
                  cp -r site/. _site/
                  cp -r target/doc/. _site/docs/

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: _site
                  cname: rustigram.io
                  force_orphan: true
