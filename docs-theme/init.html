<!-- IBM Plex Mono — weights matching Source Code Pro usage in rustdoc -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap"
/>

<!-- Override the mono font variable before the first paint -->
<style>
  :root {
    --font-family-code: "IBM Plex Mono", "Source Code Pro", monospace;
  }
</style>

<style>
  /* Allow logo + text to sit on the same line in the sidebar crate heading */
  .sidebar-crate h2 a {
    display: flex !important;
    align-items: center;
    gap: 6px;
  }
  .sidebar-crate h2 a img {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
</style>

<script>
  /**
   * Redirect rustdoc's built-in theme names to our Telegram themes.
   *
   * Runs after storage.js (which is also in <head>) so we can:
   *   1. Patch the localStorage keys that "Use system preference" reads.
   *   2. Immediately correct data-theme on <html> if storage.js applied a default.
   *
   * Keys we patch:
   *   rustdoc-preferred-dark-theme  → tg-dark
   *   rustdoc-preferred-light-theme → tg-light
   *   rustdoc-theme                 → tg-dark | tg-light (based on OS preference)
   */
  (function () {
    /* ── 1. Redirect built-in themes to Telegram themes ── */
    var BUILT_IN = { dark: 1, light: 1, ayu: 1 };

    var sysDark =
      window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches;

    try {
      /* ── 1. Fix system-preference theme targets ── */
      var dp = localStorage.getItem("rustdoc-preferred-dark-theme");
      if (!dp || BUILT_IN[dp]) {
        localStorage.setItem("rustdoc-preferred-dark-theme", "tg-dark");
      }

      var lp = localStorage.getItem("rustdoc-preferred-light-theme");
      if (!lp || BUILT_IN[lp]) {
        localStorage.setItem("rustdoc-preferred-light-theme", "tg-light");
      }

      /* ── 2. Fix the stored theme selection ── */
      var stored = localStorage.getItem("rustdoc-theme");
      if (!stored || BUILT_IN[stored]) {
        localStorage.setItem("rustdoc-theme", sysDark ? "tg-dark" : "tg-light");
      }

      /* ── 3. Immediately correct the live data-theme attribute ──
       *  storage.js already ran and may have set data-theme="dark" etc.
       *  We fix it right now so there is no flash of the wrong theme.   */
      var applied = document.documentElement.getAttribute("data-theme");
      if (!applied || BUILT_IN[applied]) {
        document.documentElement.setAttribute(
          "data-theme",
          sysDark ? "tg-dark" : "tg-light",
        );
      }
    } catch (e) {
      /* localStorage blocked in some private-browse contexts */
    }

    /* ── 2. Favicon + sidebar tweaks (need DOM ready) ── */
    document.addEventListener("DOMContentLoaded", function () {
      /* Replace rustdoc's Rust logo favicon with ours */
      document
        .querySelectorAll('link[rel="icon"], link[rel="alternate icon"]')
        .forEach(function (el) {
          el.remove();
        });
      var fav = document.createElement("link");
      fav.rel = "icon";
      fav.type = "image/svg+xml";
      fav.href = "https://rustigram.io/logo.svg";
      document.head.appendChild(fav);

      var meta = document.querySelector('meta[name="rustdoc-vars"]');
      if (meta && meta.getAttribute("data-current-crate") === "rustigram") {
        var crateLink = document.querySelector(".sidebar-crate h2 a");
        if (crateLink) {
          crateLink.href = "https://rustigram.io";

          var logo = document.createElement("img");
          logo.src = "https://rustigram.io/logo.svg";
          logo.alt = "rustigram";
          logo.setAttribute("aria-hidden", "true");
          crateLink.insertBefore(logo, crateLink.firstChild);
        }
      }
    });
  })();
</script>
